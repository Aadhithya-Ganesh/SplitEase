services:
  frontend:
    build: ./Frontend
    ports:
      - "80:80"
    networks:
      - frontend
    depends_on:
      api-service:
        condition: service_healthy
  api-service:
    build: ./Backend
    env_file:
      - ./Backend/.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - frontend

networks:
  backend:
  frontend:
