services:
  api:
    build: ./Backend
    ports:
      - "8080:8080"
    env_file:
      - ./Backend/.env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend
    volumes:
      - ./Backend/app:/app/app

networks:
  backend:
